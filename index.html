<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數碼暴龍世界2 圖鑑與DNA合體</title>

<style>
/* Layout: one column of game-style "windows" (navy fill, pale-blue frame) under a sticky filter bar */
:root{
  --bg:#e9edf5; --panel:#ffffff; --ink:#18223a; --muted:#5b6782; --line:#c6d0e3;
  --win:#1d2f6b; --win-ink:#f4f7ff; --frame:#9cc3f0; --accent:#2a5bd7;
  --vac:#2a7bd6; --vir:#8a3fb0; --dat:#1f9a8a;
  --e-water:#2a7bd6; --e-fire:#d64b2a; --e-nature:#2f9a46; --e-machine:#b38a12; --e-dark:#6a4a8a;
  --chip:#eef2fa; --chip-on:#1d2f6b; --chip-on-ink:#fff;
  --f-display:"DotGothic16","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1326; --panel:#151d36; --ink:#e6ebf7; --muted:#9aa6c4; --line:#2a3658;
  --win:#1d2f6b; --win-ink:#f4f7ff; --frame:#7fb0ea; --accent:#8fb4ff;
  --vac:#6fb0ff; --vir:#c58ae6; --dat:#5fd3c2;
  --e-water:#6fb0ff; --e-fire:#ff8a6a; --e-nature:#6fd38a; --e-machine:#e6c25a; --e-dark:#b39ae0;
  --chip:#1c2645; --chip-on:#8fb4ff; --chip-on-ink:#0d1326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1326; --panel:#151d36; --ink:#e6ebf7; --muted:#9aa6c4; --line:#2a3658;
  --win:#1d2f6b; --win-ink:#f4f7ff; --frame:#7fb0ea; --accent:#8fb4ff;
  --vac:#6fb0ff; --vir:#c58ae6; --dat:#5fd3c2;
  --e-water:#6fb0ff; --e-fire:#ff8a6a; --e-nature:#6fd38a; --e-machine:#e6c25a; --e-dark:#b39ae0;
  --chip:#1c2645; --chip-on:#8fb4ff; --chip-on-ink:#0d1326; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--win)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--win);color:var(--win-ink);border-bottom:3px solid var(--frame)}
header.top .wrap{padding-block:18px 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4.5vw,30px);margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{color:#c9d8f5;font-size:13px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px}
.tab{font:inherit;font-weight:700;border:2px solid var(--win);background:transparent;color:var(--ink);padding:6px 14px;border-radius:4px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--win);color:var(--win-ink);border-color:var(--frame)}
input[type=search]{font:inherit;flex:1 1 220px;min-width:0;padding:8px 12px;border:2px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
input[type=search]:focus,.tab:focus-visible,.chip:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
select{font:inherit;padding:7px 10px;border:2px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);max-width:100%}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;min-width:2.5em}
.count{font-size:13px;color:var(--muted)}
main .wrap{padding-block:16px 40px;display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:4px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.card.vac{border-left-color:var(--vac)} .card.vir{border-left-color:var(--vir)} .card.dat{border-left-color:var(--dat)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.nm{font-family:var(--f-display);font-size:20px;letter-spacing:.03em}
.en{color:var(--muted);font-size:13px}
.no{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px}
.tag{padding:1px 8px;border-radius:3px;border:1px solid var(--line)}
.t-vac{color:var(--vac);border-color:currentColor}.t-vir{color:var(--vir);border-color:currentColor}.t-dat{color:var(--dat);border-color:currentColor}
.e-水{color:var(--e-water)}.e-火{color:var(--e-fire)}.e-自然{color:var(--e-nature)}.e-機械{color:var(--e-machine)}.e-暗{color:var(--e-dark)}
.locs{display:flex;flex-wrap:wrap;gap:6px}
.evo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.evnote{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted)}
.evh{font-weight:700;color:var(--muted,#888);margin-right:2px}
.evl{font:inherit;font-size:13px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:2px 9px;cursor:pointer;color:inherit}
.evl:hover{border-color:currentColor}
.evl i{font-style:normal;opacity:.7;font-size:12px}

.loc{background:var(--win);color:var(--win-ink);border:1px solid var(--frame);border-radius:3px;padding:2px 8px;font-size:13px}
.loc b{font-weight:500}
.loc span{color:#b9cdf2;font-size:12px;font-variant-numeric:tabular-nums}
.none{color:var(--muted);font-size:14px}
.boss{font-size:12.5px;color:var(--muted)}
.hall{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.hall h2{margin:0;background:var(--win);color:var(--win-ink);font-family:var(--f-display);font-weight:400;font-size:18px;padding:8px 14px;border-bottom:2px solid var(--frame)}
.hall ul{list-style:none;margin:0;padding:6px 14px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 16px}
.hall li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dotted var(--line);min-width:0}
.hall li .fl{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.note{font-size:12.5px;color:var(--muted);max-width:65ch}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
.dnabox{display:grid;gap:12px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.pick{grid-template-columns:1fr}}
.pick label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.pick input{font:inherit;font-size:15px;padding:8px 12px;border:2px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);min-width:0}
.pick input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.result{background:var(--win);color:var(--win-ink);border:2px solid var(--frame);border-radius:4px;padding:14px;display:grid;gap:4px}
.result .big{font-family:var(--f-display);font-size:24px}
.result .small{color:#c9d8f5;font-size:13px}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 14px 10px}
.rules summary{cursor:pointer;font-weight:700;padding:6px 0}
.rules p{margin:6px 0;font-size:13.5px}
.rules table{border-collapse:collapse;font-size:13px;margin:4px 0}
.rules td,.rules th{border:1px solid var(--line);padding:2px 10px;text-align:center}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.gridwrap table{border-collapse:collapse;font-size:13px;min-width:640px;width:100%}
.gridwrap th,.gridwrap td{border:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
.gridwrap th{background:var(--win);color:var(--win-ink);font-weight:500}
.gridwrap td.hl{background:var(--accent);color:var(--chip-on-ink);font-weight:700}
.gridwrap th.hl{background:var(--accent);color:var(--chip-on-ink)}
[hidden]{display:none!important}
</style>
</head>

<header class="top"><div class="wrap">

<main><div class="wrap" id="list"></div><div class="wrap" id="dna" hidden></div></main>
<footer><div class="wrap" style="padding-block:0 32px"><p class="note">招募地點取自遊戲本身的樓層遭遇資料：該數碼暴龍在列出的樓層會以野生數碼暴龍出現，可用禮物招募。頭目戰、劇情戰和 DNA 合體不算，無法野生遇到的顯示「—」。樓層同時包含三組遭遇，實際遇到哪一組由遊戲決定。資料未在遊戲中逐一驗證。　DNA合體資料取自遊戲程式與記憶體資料。</p><p class="note">用詞對照遊戲內：世代＝成長期、成熟期、完全體、究極體；種族＝疫苗、病毒、數據；屬性＝水、火、自然、機械、暗；種類＝垃圾、昆蟲、植物、飛行、精靈、野獸、龍、水生（遊戲沒有給這一類名稱，只用在合體對照表）。</p></div></footer>

function calc(){
  const a=find($('#pa').value),b=find($('#pb').value),R=$('#dres');
  if(!a||!b){hl=null;R.innerHTML='<span class="small">選好兩隻親代，這裡會顯示合體結果。</span>';grid();return}
  const low=ORD[Math.min(ORD.indexOf(a.s),ORD.indexOf(b.s))],rs=RES[low],bl=BLK(a.t,b.t);
  const t=DD.DNA[rs][bl],i=t.c.indexOf(a.f),j=t.c.indexOf(b.f);
  if(i<0||j<0){R.innerHTML='<span class="small">此組合（種類「'+esc(i<0?a.f:b.f)+'」）表中沒有資料。</span>';hl=null;grid();return}
  const v=t.m[i][j];gs=rs;gb=bl;hl=[i,j];
  R.innerHTML='<span class="small">'+esc(a.n)+'（'+esc(a.f)+'・'+esc(a.t)+'）＋'+esc(b.n)+'（'+esc(b.f)+'・'+esc(b.t)+'）→ '+esc(rs)+'表・'+esc(bl)+'種</span><span class="big">'+esc(v)+'</span>'+'<span class="small">'+esc(baseNote(a,b))+'</span>'+(v.includes('★')?'<span class="small">★＝突變記號，只有特定親代組合才會真的變成它，詳見「合體規則」第4點。</span>':'');
  grid();
}
$('#pa').oninput=calc;$('#pb').oninput=calc;
grid();
})();
</script>

</body>
